version: '3.8'

services:
  # Base de datos MongoDB
  mongo:
    image: mongo:7
    container_name: epark-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=epark
    volumes:
      - epark_mongodb_data:/data/db

volumes:
  epark_mongodb_data:
    name: epark_mongodb_data
